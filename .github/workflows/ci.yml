name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn build:example
      - run: yarn type-check
      - run: yarn lint
      - name: Install PostgreSQL
        run: sudo apt-get install -y --no-install-recommends postgresql
      - run: yarn test
